# X3D-S stream for strict 50/5 ZSL on the canonical 45/25/10/20 subject split.
NUM_GPUS: 1
NUM_NODES: 1
RANK_ID: 0
RNG_SEED: 1
OUTPUT_DIR: 'outputs/x3d-s_clipgcn_tensor_cs_45_25_10_20_zsl50_5_182'
TRAIN:
  MAX_ITER: 7000
  SAVE_STEP: 250
  EVAL_STEP: 250
TEST:
  CHECKPOINT: 'outputs/x3d-s_clipgcn_tensor_cs_45_25_10_20_zsl50_5_182/model_final.pth'
  OUTPUT_DIR: 'outputs/x3d-s_clipgcn_tensor_cs_45_25_10_20_zsl50_5_182/test'
DATASETS:
  TRAIN:
    DATA_DIR: 'data/etri_rgb_c001_cs_45_25_10_20'
    ANNOTATION_DIR: 'data/etri_rgb_c001_cs_45_25_10_20'
  TEST:
    NAME: 'CLIPGCN_TENSOR'
    DATA_DIR: 'data/etri_rgb_c001_cs_45_25_10_20'
    ANNOTATION_DIR: 'data/etri_rgb_c001_cs_45_25_10_20'
MODEL:
  NAME: 'X3D_S'
  PRETRAINED: 'pretrained/x3d_s.pyth'
  SYNC_BN: False
  CONV_LAYER: 'Conv3d'
  POOL_LAYER: 'MaxPool3d'
  NORM_LAYER: 'BatchNorm3d'
  ACT_LAYER: 'ReLU'
  BACKBONE:
    NAME: 'X3D'
    IN_CHANNELS: 3
    PARTIAL_BN: False
    TORCHVISION_PRETRAINED: False
    ZERO_INIT_RESIDUAL: True
    BASE_CHANNEL: 24
    CONV1_KERNEL: (3, 3, 3)
    CONV1_STRIDE: (1, 2, 2)
    CONV1_PADDING: (1, 1, 1)
    WITH_POOL1: False
    WITH_POOL2: False
    STAGE_BLOCKS: (3, 5, 11, 7)
    RES_PLANES: (54, 108, 216, 432)
    EXPANSION: 0.445
    SPATIAL_STRIDES: (2, 2, 2, 2)
    INFLATES: (1, 1, 1, 1)
    INFLATE_STYLE: '3x3x3'
  HEAD:
    NAME: 'X3DHead'
    FEATURE_DIMS: 192
    DROPOUT: 0.5
    NUM_CLASSES: 55
    CONV5_CHANNELS: 432
    POOL5_KERNEL: (13, 5, 5)
  RECOGNIZER:
    NAME: 'OfficialX3DRecognizer'
  CONSENSU:
    NAME: 'AvgConsensus'
  CRITERION:
    NAME: 'CrossEntropyLoss'
    LABEL_SMOOTHING: 0.1
