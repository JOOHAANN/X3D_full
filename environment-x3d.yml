name: clipgcn
channels:
  - conda-forge
dependencies:
  - python=3.10.19
  - pip=25.3
  - numpy=1.26.4
  - pillow=12.0.0
  - opencv
  - pyyaml
  - tabulate
  - tensorboard
  - tqdm
  - pip:
      # cu128 is the compatibility change required by the sm_120 Blackwell GPU.
      - --index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0
      - torchvision==0.26.0
